<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>
  <!-- Rounded Square Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Shopping Cart with Grocery Basket Theme -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- Basket Outline -->
    <path d="M120 190 h272 l-32 170 H152 Z" stroke-width="32" fill="#FFFFFF" fill-opacity="0.15" />
    
    <!-- Basket Grid Lines -->
    <line x1="200" y1="190" x2="190" y2="360" stroke-width="24" />
    <line x1="256" y1="190" x2="256" y2="360" stroke-width="24" />
    <line x1="312" y1="190" x2="322" y2="360" stroke-width="24" />
    <line x1="135" y1="275" x2="377" y2="275" stroke-width="24" />
    
    <!-- Basket Handles -->
    <path d="M170 190 L256 95 L342 190" stroke-width="32" />
  </g>
  
  <!-- Fresh Leaf / Produce Indicator (Green accent badge) -->
  <circle cx="380" cy="130" r="48" fill="#10B981" />
  <path d="M365 145 C365 125 385 110 398 115 C400 130 385 150 365 145 Z" fill="#FFFFFF" />
</svg>
